<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>证件照排版工具</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root { color-scheme:light; --accent:#0066cc; --ink:#1d1d1f; --line:#dedee3; --surface:#f5f5f7 }
body.suite { display:block; margin:0; padding:0; color:var(--ink); background:var(--surface); font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif }
.suite * { box-sizing:border-box }
.suite .tool-nav { background:#fff; color:var(--ink); border-bottom:1px solid var(--line); padding:0; margin:0 }
.suite .tool-nav nav { display:flex; flex-wrap:wrap; align-items:center; gap:6px 28px; max-width:1100px; margin:auto; padding:12px 22px; background:none; border:0 }
.suite .tool-nav nav div { display:flex; flex-wrap:wrap; gap:4px 18px }
.suite .tool-nav a { display:inline-block; background:none; color:var(--ink); padding:4px 0; text-decoration:none; white-space:nowrap; font-size:14px }
.suite .tool-nav a.brand { font-size:19px; font-weight:700 }
.suite .tool-nav a:hover,.suite .tool-nav a[aria-current] { color:var(--accent) }
.suite .suite-main,.suite .shell { width:min(100%,1050px); margin:auto; padding:24px 22px }
.suite .suite-panel,.suite .hero,.suite .upload-panel,.suite .summary-panel,.suite .log-panel,.suite .related-panel { background:white; border:1px solid var(--line); border-radius:8px; box-shadow:none }
.suite .suite-panel { padding:22px; margin:0 0 16px }
.suite h1,.suite h2 { color:var(--ink); text-align:left; letter-spacing:0; padding:0; border:0 }
.suite h1 { font-size:28px; line-height:1.2; margin:0 0 16px }
.suite h2 { font-size:21px; margin:0 0 12px }
.suite input,.suite select,.suite textarea,.suite button { font:inherit; max-width:100%; accent-color:var(--accent) }
.suite button,.suite #downloadImg { background:var(--accent); color:white; border:0; border-radius:8px; padding:8px 15px; box-shadow:none; cursor:pointer }
.suite button:hover:not(:disabled),.suite #downloadImg:hover { background:#0054a9 }
.suite button:disabled { opacity:.55; cursor:default }
.suite :focus-visible { outline:2px solid var(--accent); outline-offset:3px }
.suite #output,.suite #result { background:var(--surface); color:var(--ink); border-radius:8px; box-shadow:none; overflow-wrap:anywhere }
.suite #output:empty,.suite #result:empty { display:none }
.suite .hero-panel,.suite .drop-zone,.suite .stats div { background:var(--surface); color:var(--ink); box-shadow:none }
.suite .hero-panel p,.suite .subtitle,.suite .hero-panel strong { color:var(--ink) }
.suite .hero-panel > span,.suite .hero .eyebrow { display:none }
.suite canvas { height:auto; max-width:100% }
.suite .container.suite-panel { max-width:none; width:auto; margin:0; transform:none }
.suite .container > label { display:flex; gap:8px; align-items:center; margin:10px 0; background:none; box-shadow:none }
.suite #length { width:100%; appearance:auto }
@media(max-width:650px) {
  .suite .tool-nav nav { padding:9px 14px; gap:3px 14px }
  .suite .suite-main,.suite .shell { padding:14px }
  .suite .suite-panel { padding:16px }
  .suite h1 { font-size:23px }
}
</style>
</head>
<body class="suite"><header class="tool-nav"><nav aria-label="工具导航"><a class="brand" href="https://baicaige.github.io/format-tool/">白菜的小工具</a><div><a href="https://baicaige.github.io/format-tool/#openid">OpenID 拆分</a><a href="https://baicaige.github.io/excel-splitter/">Excel 拆分</a><a href="https://baicaige.github.io/format-tool/zhengjianzhao.html" aria-current="page">证件照排版</a><a href="https://baicaige.github.io/format-tool/mima.html">随机密码</a></div></nav></header>

  <main class="suite-main"><div class="suite-panel space-y-6">

    <header class="text-center">
      <h1 class="text-3xl font-bold text-gray-800 mb-1">证件照排版工具</h1>
      <p class="text-gray-500 text-sm">排版输出适用于 5 寸相纸，支持多种标准尺寸</p>
    </header>

    <!-- 上传 -->
    <div>
      <label class="block text-gray-700 font-medium mb-1">上传证件照</label>
      <input id="upload" type="file" accept="image/*"
             class="w-full border border-gray-300 rounded-lg p-3 text-sm text-gray-700 focus:ring-blue-500 focus:border-blue-500" />
    </div>

    <!-- 尺寸选择 -->
    <div>
      <label class="block text-gray-700 font-medium mb-1">选择排版尺寸</label>
      <select id="mode"
              class="w-full border border-gray-300 rounded-lg p-3 text-sm text-gray-700 focus:ring-blue-500 focus:border-blue-500">
        <option value="1inch">一寸（25×35mm）</option>
        <option value="2inch">二寸（35×49mm）</option>
        <option value="large1">大一寸（33×48mm）</option>
        <option value="small1">小一寸（22×32mm）</option>
        <option value="small2">小二寸（35×45mm）</option>
        <option value="large2">大二寸（35×53mm）</option>
        <option value="card">社保/身份证（26×32mm）</option>
        <option value="mix">1寸 + 2寸混排</option>
      </select>
    </div>

    <!-- 生成按钮 -->
    <div>
      <button onclick="layout()"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition duration-200">
        排版生成
      </button>
    </div>

    <!-- 预览区 -->
    <div id="previewSection" class="hidden space-y-4">
      <h2 class="text-center text-lg font-semibold text-gray-700">排版预览</h2>
      <div class="overflow-x-auto">
        <canvas id="canvas" width="1500" height="1050"
                class="mx-auto border rounded-lg shadow max-w-full"></canvas>
      </div>

      <!-- 下载按钮 -->
      <div id="downloadButtons" class="flex flex-col sm:flex-row justify-center items-center gap-4">
        <a id="downloadImg" href="#" download="id_photo_5inch.jpg"
           class="w-full sm:w-auto text-center bg-green-600 hover:bg-green-700 text-white font-semibold px-6 py-3 rounded-lg transition duration-200">
          下载图片
        </a>
        <button onclick="downloadPDF()"
                class="w-full sm:w-auto bg-purple-600 hover:bg-purple-700 text-white font-semibold px-6 py-3 rounded-lg transition duration-200">
          下载 PDF
        </button>
      </div>
    </div>
  </div>

</main>
  <script>
    let uploadedImg = null;
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    const sizes = {
      "1inch":   { w: 295, h: 413 },
      "2inch":   { w: 413, h: 579 },
      "large1":  { w: 390, h: 567 },
      "small1":  { w: 260, h: 378 },
      "small2":  { w: 413, h: 531 },
      "large2":  { w: 413, h: 626 },
      "card":    { w: 307, h: 378 },
      "mix":     "MIX"
    };

    document.getElementById('upload').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return alert("请选择图片文件");

      const reader = new FileReader();
      reader.onload = function(evt) {
        uploadedImg = new Image();
        uploadedImg.onload = () => {
          alert("图片上传成功，点击『排版生成』");
          document.getElementById('previewSection').classList.add('hidden');
        };
        uploadedImg.onerror = () => alert("图片加载失败，请确认格式");
        uploadedImg.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    });

    function getCropRect(img, targetW, targetH) {
      const imgW = img.width, imgH = img.height;
      const targetRatio = targetW / targetH;
      const imgRatio = imgW / imgH;
      let sx, sy, sw, sh;
      if (imgRatio > targetRatio) {
        sh = imgH; sw = sh * targetRatio; sx = (imgW - sw) / 2; sy = 0;
      } else {
        sw = imgW; sh = sw / targetRatio; sx = 0; sy = (imgH - sh) / 2;
      }
      return { sx, sy, sw, sh };
    }

    function layout() {
      if (!uploadedImg || !uploadedImg.complete) {
        alert("请等待图片加载完成");
        return;
      }

      const mode = document.getElementById("mode").value;
      const margin = 30;
      const maxW = canvas.width, maxH = canvas.height;
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, maxW, maxH);

      if (mode === "mix") {
        const s1 = sizes["1inch"], s2 = sizes["2inch"];
        const c1 = getCropRect(uploadedImg, s1.w, s1.h);
        const c2 = getCropRect(uploadedImg, s2.w, s2.h);
        let x = margin, y = margin, useS1 = true;
        while (y + s1.h <= maxH - margin || y + s2.h <= maxH - margin) {
          const size = useS1 ? s1 : s2;
          const crop = useS1 ? c1 : c2;
          if (x + size.w > maxW - margin) {
            x = margin; y += size.h + margin; useS1 = !useS1;
            continue;
          }
          ctx.drawImage(uploadedImg, crop.sx, crop.sy, crop.sw, crop.sh, x, y, size.w, size.h);
          x += size.w + margin;
        }
      } else {
        const size = sizes[mode];
        const crop = getCropRect(uploadedImg, size.w, size.h);
        let x = margin, y = margin;
        while (y + size.h <= maxH - margin) {
          while (x + size.w <= maxW - margin) {
            ctx.drawImage(uploadedImg, crop.sx, crop.sy, crop.sw, crop.sh, x, y, size.w, size.h);
            x += size.w + margin;
          }
          x = margin;
          y += size.h + margin;
        }
      }

      const dataURL = canvas.toDataURL("image/jpeg", 1.0);
      document.getElementById('downloadImg').href = dataURL;
      document.getElementById('previewSection').classList.remove('hidden');
    }

    async function downloadPDF() {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: 'landscape', unit: 'px', format: [1500, 1050] });
      const imgData = canvas.toDataURL("image/jpeg", 1.0);
      pdf.addImage(imgData, 'JPEG', 0, 0, 1500, 1050);
      pdf.save("id_photo_5inch.pdf");
    }
  </script>
</body>
</html>
