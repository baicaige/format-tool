<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>白菜的小工具</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --paper: #ffffff;
      --ink: #172033;
      --muted: #647084;
      --line: #d9e1ec;
      --blue: #185a9d;
      --green: #1f8a70;
      --soft-blue: #eaf4ff;
      --soft-green: #e8f7f2;
      --shadow: 0 18px 44px rgba(23, 32, 51, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 16px;
      line-height: 1.55;
    }

    button,
    textarea {
      font: inherit;
    }

    .shell {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .hero,
    .formatter,
    .tool-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 310px;
      gap: 20px;
      margin-bottom: 20px;
    }

    .hero-main {
      padding: 34px;
      color: #fff;
      background: linear-gradient(135deg, #123d6b, #185a9d 52%, #1f8a70);
    }

    .hero-side {
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: inherit;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0;
    }

    h1,
    h2,
    h3 {
      margin: 0;
      letter-spacing: 0;
      line-height: 1.16;
    }

    h1 {
      font-size: clamp(38px, 6vw, 68px);
    }

    h2 {
      font-size: 24px;
    }

    .subtitle {
      max-width: 760px;
      margin: 14px 0 0;
      font-size: 20px;
    }

    .badge {
      width: max-content;
      max-width: 100%;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--soft-green);
      color: var(--green);
      font-weight: 800;
      font-size: 13px;
    }

    .hero-side strong {
      font-size: 26px;
      line-height: 1.2;
    }

    .hero-side p,
    .section-head p,
    .tool-card p {
      margin: 0;
      color: var(--muted);
    }

    .formatter {
      padding: 22px;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: end;
      margin-bottom: 16px;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      padding: 14px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfdff;
      color: var(--ink);
      font-family: "Courier New", Courier, monospace;
    }

    textarea:focus {
      border-color: var(--blue);
      outline: none;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(24, 90, 157, 0.12);
    }

    .primary-button,
    .tool-card a {
      min-height: 48px;
      border: 0;
      border-radius: 8px;
      background: var(--blue);
      color: #fff;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
    }

    .primary-button {
      width: 100%;
      margin-top: 14px;
      padding: 0 18px;
    }

    #output {
      margin-top: 16px;
      min-height: 70px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0f1724;
      color: #dce9ff;
      white-space: pre-wrap;
      user-select: all;
      font-family: "Courier New", Courier, monospace;
      font-size: 14px;
    }

    .tools-section {
      margin-top: 20px;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-top: 14px;
    }

    .tool-card {
      min-height: 190px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .tool-icon {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      border-radius: 8px;
      background: var(--soft-blue);
      color: var(--blue);
      font-weight: 900;
    }

    .tool-card a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: auto;
      padding: 0 14px;
    }

    .tool-card.featured {
      border-color: rgba(31, 138, 112, 0.35);
      background: linear-gradient(180deg, #ffffff, #f6fffb);
    }

    .tool-card.featured .tool-icon,
    .tool-card.featured a {
      background: var(--green);
      color: #fff;
    }

    @media (max-width: 860px) {
      .hero,
      .tools-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {
      .shell {
        width: min(100% - 20px, 1120px);
        padding-top: 10px;
      }

      .hero-main,
      .hero-side,
      .formatter,
      .tool-card {
        padding: 18px;
      }

      .subtitle {
        font-size: 17px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero" aria-labelledby="pageTitle">
      <div class="hero-main">
        <p class="eyebrow">日常高频 · 打开就用</p>
        <h1 id="pageTitle">白菜的小工具</h1>
        <p class="subtitle">把零散的小需求放在一个入口里：文本格式化、Excel 拆分、证件照排版、随机密码。</p>
      </div>
      <aside class="hero-side" aria-label="推荐工具">
        <span class="badge">新工具</span>
        <strong>Excel 按列拆分</strong>
        <p>按 A 列或指定列拆分为多个 Excel，浏览器本地处理，不上传表格。</p>
      </aside>
    </section>

    <section class="formatter" aria-labelledby="formatTitle">
      <div class="section-head">
        <div>
          <p class="eyebrow" style="color: var(--blue)">文本处理</p>
          <h2 id="formatTitle">每行数据加逗号</h2>
        </div>
      </div>
      <textarea id="input" placeholder="请输入数据，每行一个"></textarea>
      <button class="primary-button" id="formatBtn" type="button">格式化并复制</button>
      <div id="output"></div>
    </section>

    <section class="tools-section" aria-labelledby="toolsTitle">
      <div class="section-head">
        <div>
          <p class="eyebrow" style="color: var(--green)">工具箱</p>
          <h2 id="toolsTitle">更多工具</h2>
        </div>
      </div>
      <div class="tools-grid">
        <article class="tool-card featured">
          <div class="tool-icon">XLS</div>
          <h3>Excel 拆分工具</h3>
          <p>按列值拆分数据表，批量导出 `值_行数.xlsx`。</p>
          <a href="https://baicaige.github.io/excel-splitter/">打开工具</a>
        </article>
        <article class="tool-card">
          <div class="tool-icon">ID</div>
          <h3>证件照排版工具</h3>
          <p>上传证件照，按常见尺寸排版，支持图片和 PDF 下载。</p>
          <a href="https://baicaige.github.io/format-tool/zhengjianzhao.html">打开工具</a>
        </article>
        <article class="tool-card">
          <div class="tool-icon">PWD</div>
          <h3>随机密码工具</h3>
          <p>快速生成指定长度和字符类型的随机密码。</p>
          <a href="https://baicaige.github.io/format-tool/mima.html">打开工具</a>
        </article>
      </div>
    </section>
  </main>

  <script>
    async function formatAndCopy() {
      const input = document.getElementById("input").value.trim();
      if (!input) {
        alert("请输入内容");
        return;
      }

      const lines = input.split("\n").map((line) => line.trim()).filter((line) => line.length > 0);
      const formattedGroups = [];

      for (let i = 0; i < lines.length; i += 6) {
        const group = lines.slice(i, i + 6).map((line) => `'${line}'`);
        formattedGroups.push(group.join(", "));
      }

      const finalResult = formattedGroups.join(",\n");
      document.getElementById("output").textContent = finalResult;

      try {
        await navigator.clipboard.writeText(finalResult);
        alert("已复制到剪切板");
      } catch (err) {
        const temp = document.createElement("textarea");
        temp.value = finalResult;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand("copy");
        document.body.removeChild(temp);
        alert("已复制到剪切板（兼容模式）");
      }
    }

    document.getElementById("formatBtn").addEventListener("click", formatAndCopy);
  </script>
</body>
</html>
