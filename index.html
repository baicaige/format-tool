<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>白菜的小工具</title>
<style>
* { box-sizing: border-box }
body { margin: 0; background: #f2f4f7; color: #232a34; font: 16px/1.6 system-ui, sans-serif }
header { background: #303949; color: white; padding: 13px 24px; font-size: 21px; font-weight: 700 }
.layout { display: grid; grid-template-columns: 215px minmax(0, 1fr); min-height: calc(100vh - 60px) }
nav { background: #fafafa; padding: 18px 12px; border-right: 1px solid #e2e5ea }
nav a { display: block; padding: 9px 12px; color: #394250; text-decoration: none; border-radius: 6px }
nav a[aria-current] { background: #c8420d; color: white }
nav a:hover:not([aria-current]) { background: #e9edf2 }
main { width: 100%; max-width: 1050px; padding: 24px }
section { background: white; padding: 22px; margin-bottom: 16px; border: 1px solid #e2e5ea }
h1,h2 { margin: 0 0 18px; font-size: 21px; border-left: 4px solid #0879d5; padding-left: 10px }
form { display: flex; flex-wrap: wrap; gap: 14px; align-items: end }
label { display: grid; gap: 5px; min-width: 0 }
input,select,button,textarea { font: inherit; max-width: 100% }
input,select,textarea { border: 1px solid #cdd4dc; border-radius: 6px; padding: 7px; background: white }
button { background: #c8420d; color: white; border: 0; border-radius: 6px; padding: 8px 16px; cursor: pointer }
button:disabled { opacity: .65; cursor: wait }
textarea { display: block; width: 100%; min-height: 110px; margin-bottom: 10px }
pre, #downloads { overflow-wrap: anywhere; white-space: pre-wrap }
#downloads { max-height: 320px; overflow: auto; padding-left: 24px }
#downloads:empty { display: none }
a { color: #085da3 }
@media(max-width: 650px) {
  .layout { grid-template-columns: 1fr }
  nav { display: flex; flex-wrap: wrap; border-right: 0 }
  main, section { padding: 14px }
}
</style>
<header>白菜的小工具</header>
<div class="layout">
<nav aria-label="工具导航">
  <a href="#openid" aria-current="location">OpenID 拆分</a>
  <a href="#formatter">每行数据加逗号</a>
  <a href="https://baicaige.github.io/excel-splitter/">Excel 拆分</a>
  <a href="zhengjianzhao.html">证件照排版</a>
  <a href="mima.html">随机密码</a>
</nav>
<main>
  <section id="openid">
    <h1>OpenID 拆分</h1>
    <form id="split">
      <label>微信粉丝 CSV <input id="csv" type="file" accept=".csv,text/csv" required></label>
      <label>每个 TXT 的条数
        <select id="size"><option>100</option><option>200</option><option selected>500</option><option>1000</option><option>2000</option><option>3000</option><option>5000</option><option>10000</option><option>15000</option><option>20000</option><option>30000</option><option>50000</option><option>100000</option></select>
      </label>
      <button id="splitBtn" type="submit">拆分 TXT</button>
    </form>
    <p id="status" role="status">文件在浏览器本地处理。</p>
    <button id="saveFolder" type="button" hidden>保存全部到文件夹</button>
    <ol id="downloads"></ol>
  </section>
  <section id="formatter">
    <h2>每行数据加逗号</h2>
    <textarea id="input" aria-label="原始文本" placeholder="请输入数据，每行一个"></textarea>
    <button id="formatBtn" type="button">格式化并复制</button>
    <pre id="output"></pre>
  </section>
</main>
</div>
<script>
  // Quoted CSV fields can contain commas, line breaks and escaped quotes.
  function* csvRows(text) {
    const token = /(?:"((?:[^"]|"")*)"|([^",\r\n]*))(,|\r\n|\r|\n|$)/y;
    let row = [];
    while (token.lastIndex < text.length) {
      const match = token.exec(text);
      if (!match) throw new Error("CSV 格式有误，请重新导出。");
      row.push(match[1] === undefined ? match[2] : match[1].replace(/""/g, '"'));
      if (match[3] !== ",") {
        yield row;
        row = [];
      }
    }
    if (row.length) yield [...row, ""];
  }

  function extractOpenIds(text) {
    const rows = csvRows(text.replace(/^\uFEFF/, ""));
    const header = rows.next().value || [];
    const col = header.findIndex(value => value.trim().toLowerCase() === "openid");
    if (col < 0) throw new Error("CSV 缺少 openid 列。");
    const ids = [];
    for (const row of rows) {
      const id = row[col]?.trim();
      if (!id) continue;
      if (/[\r\n]/.test(id)) throw new Error("OpenID 字段包含换行。");
      ids.push(id);
    }
    if (!ids.length) throw new Error("没有可导出的 OpenID。");
    return ids;
  }

  const downloads = document.getElementById("downloads");
  const status = document.getElementById("status");
  const csv = document.getElementById("csv");
  const size = document.getElementById("size");
  const saveFolder = document.getElementById("saveFolder");
  let files = [];

  async function saveAll(folder) {
    const splitButton = document.getElementById("splitBtn");
    saveFolder.disabled = splitButton.disabled = csv.disabled = size.disabled = true;
    let saved = 0;
    let skipped = 0;
    try {
      if (!folder && !window.showDirectoryPicker) {
        status.textContent = "当前浏览器不支持选择文件夹。请使用桌面版 Chrome 或 Edge，或逐个下载。";
        return;
      }
      folder ??= await window.showDirectoryPicker({ mode: "readwrite" });
      for (const file of files) {
        try {
          await folder.getFileHandle(file.name);
          skipped++;
          continue;
        } catch (error) {
          if (error.name === "TypeMismatchError") {
            skipped++;
            continue;
          }
          if (error.name !== "NotFoundError") throw error;
        }
        const handle = await folder.getFileHandle(file.name, { create: true });
        const writer = await handle.createWritable();
        try {
          await writer.write(file.blob);
          await writer.close();
        } catch (error) {
          await writer.abort().catch(() => {});
          throw error;
        }
        saved++;
      }
      status.textContent = `已保存 ${saved} 个 TXT，跳过同名项 ${skipped} 个。`;
    } catch (error) {
      status.textContent = error.name === "AbortError" && !saved && !skipped
        ? "已取消或未获得文件夹访问权限。"
        : `保存中断。已保存 ${saved} 个，跳过 ${skipped} 个。${error.message}`;
    } finally {
      saveFolder.disabled = splitButton.disabled = csv.disabled = size.disabled = false;
    }
  }
  saveFolder.addEventListener("click", () => saveAll());

  function clearDownloads() {
    files.forEach(file => URL.revokeObjectURL(file.url));
    files = [];
    saveFolder.hidden = true;
    downloads.replaceChildren();
  }

  for (const control of [csv, size]) {
    control.addEventListener("change", () => {
      clearDownloads();
      status.textContent = "等待拆分。";
    });
  }

  document.getElementById("split").addEventListener("submit", async event => {
    event.preventDefault();
    const button = document.getElementById("splitBtn");
    const file = csv.files[0];
    const batch = Number(size.value);
    if (!file || !Number.isInteger(batch) || batch < 1) return;
    clearDownloads();
    button.disabled = csv.disabled = size.disabled = true;
    status.textContent = "正在读取 CSV…";
    try {
      let folder;
      let folderMessage = "";
      if (window.showDirectoryPicker) {
        try {
          folder = await window.showDirectoryPicker({ mode: "readwrite" });
        } catch (error) {
          folderMessage = error.name === "AbortError"
            ? " 已取消选择文件夹，仍可下载下方文件。"
            : " 无法选择文件夹，仍可下载下方文件。";
        }
      }
      const ids = extractOpenIds(await file.text());
      const base = file.name.replace(/\.csv$/i, "");
      const list = document.createDocumentFragment();
      for (let start = 0; start < ids.length; start += batch) {
        const end = Math.min(start + batch, ids.length);
        const data = ids.slice(start, end).join("\n") + "\n";
        const link = document.createElement("a");
        const blob = new Blob([data], { type: "text/plain;charset=utf-8" });
        link.href = URL.createObjectURL(blob);
        link.download = link.textContent = `${base}-${start + 1}-${end}.txt`;
        files.push({ name: link.download, blob, url: link.href });
        const item = document.createElement("li");
        item.append(link);
        list.append(item);
      }
      downloads.append(list);
      saveFolder.hidden = false;
      status.textContent = `${ids.length} 条 OpenID，共 ${files.length} 个 TXT。${folderMessage}`;
      if (folder) await saveAll(folder);
    } catch (error) {
      clearDownloads();
      status.textContent = error.message;
    } finally {
      button.disabled = csv.disabled = size.disabled = false;
    }
  });

    async function formatAndCopy() {
      const input = document.getElementById("input").value.trim();
      if (!input) {
        alert("请输入内容");
        return;
      }

      const lines = input.split("\n").map((line) => line.trim()).filter((line) => line.length > 0);
      const formattedGroups = [];

      for (let i = 0; i < lines.length; i += 6) {
        const group = lines.slice(i, i + 6).map((line) => `'${line}'`);
        formattedGroups.push(group.join(", "));
      }

      const finalResult = formattedGroups.join(",\n");
      document.getElementById("output").textContent = finalResult;

      try {
        await navigator.clipboard.writeText(finalResult);
        alert("已复制到剪切板");
      } catch (err) {
        const temp = document.createElement("textarea");
        temp.value = finalResult;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand("copy");
        document.body.removeChild(temp);
        alert("已复制到剪切板（兼容模式）");
      }
    }

    document.getElementById("formatBtn").addEventListener("click", formatAndCopy);
  </script>
</body>
</html>
