<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>白菜的小工具</title>
<style>
* { box-sizing: border-box }
body { margin: 0; background: #f2f4f7; color: #232a34; font: 16px/1.6 system-ui, sans-serif }
header { background: #303949; color: white; padding: 13px 24px; font-size: 21px; font-weight: 700 }
.layout { display: grid; grid-template-columns: 215px minmax(0, 1fr); min-height: calc(100vh - 60px) }
nav { background: #fafafa; padding: 18px 12px; border-right: 1px solid #e2e5ea }
nav a { display: block; padding: 9px 12px; color: #394250; text-decoration: none; border-radius: 6px }
nav a[aria-current] { background: #c8420d; color: white }
nav a:hover:not([aria-current]) { background: #e9edf2 }
main { width: 100%; max-width: 1050px; padding: 24px }
section { background: white; padding: 22px; margin-bottom: 16px; border: 1px solid #e2e5ea }
h1,h2 { margin: 0 0 18px; font-size: 21px; border-left: 4px solid #0879d5; padding-left: 10px }
form { display: flex; flex-wrap: wrap; gap: 14px; align-items: end }
label { display: grid; gap: 5px; min-width: 0 }
input,select,button,textarea { font: inherit; max-width: 100% }
input,select,textarea { border: 1px solid #cdd4dc; border-radius: 6px; padding: 7px; background: white }
button { background: #c8420d; color: white; border: 0; border-radius: 6px; padding: 8px 16px; cursor: pointer }
button:disabled { opacity: .65; cursor: wait }
textarea { display: block; width: 100%; min-height: 110px; margin-bottom: 10px }
pre, #downloads { overflow-wrap: anywhere; white-space: pre-wrap }
#downloads { max-height: 320px; overflow: auto; padding-left: 24px }
#downloads:empty { display: none }
a { color: #085da3 }
@media(max-width: 650px) {
  .layout { grid-template-columns: 1fr }
  nav { display: flex; flex-wrap: wrap; border-right: 0 }
  main, section { padding: 14px }
}
</style>
<style>
:root { color-scheme:light; --accent:#0066cc; --ink:#1d1d1f; --line:#dedee3; --surface:#f5f5f7 }
body.suite { display:block; margin:0; padding:0; color:var(--ink); background:var(--surface); font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif }
.suite * { box-sizing:border-box }
.suite .tool-nav { background:#fff; color:var(--ink); border-bottom:1px solid var(--line); padding:0; margin:0 }
.suite .tool-nav nav { display:flex; flex-wrap:wrap; align-items:center; gap:6px 28px; max-width:1100px; margin:auto; padding:12px 22px; background:none; border:0 }
.suite .tool-nav nav div { display:flex; flex-wrap:wrap; gap:4px 18px }
.suite .tool-nav a { display:inline-block; background:none; color:var(--ink); padding:4px 0; text-decoration:none; white-space:nowrap; font-size:14px }
.suite .tool-nav a.brand { font-size:19px; font-weight:700 }
.suite .tool-nav a:hover,.suite .tool-nav a[aria-current] { color:var(--accent) }
.suite .suite-main,.suite .shell { width:min(100%,1050px); margin:auto; padding:24px 22px }
.suite .suite-panel,.suite .hero,.suite .upload-panel,.suite .summary-panel,.suite .log-panel,.suite .related-panel { background:white; border:1px solid var(--line); border-radius:8px; box-shadow:none }
.suite .suite-panel { padding:22px; margin:0 0 16px }
.suite h1,.suite h2 { color:var(--ink); text-align:left; letter-spacing:0; padding:0; border:0 }
.suite h1 { font-size:28px; line-height:1.2; margin:0 0 16px }
.suite h2 { font-size:21px; margin:0 0 12px }
.suite input,.suite select,.suite textarea,.suite button { font:inherit; max-width:100%; accent-color:var(--accent) }
.suite button,.suite #downloadImg { background:var(--accent); color:white; border:0; border-radius:8px; padding:8px 15px; box-shadow:none; cursor:pointer }
.suite button:hover:not(:disabled),.suite #downloadImg:hover { background:#0054a9 }
.suite button:disabled { opacity:.55; cursor:default }
.suite :focus-visible { outline:2px solid var(--accent); outline-offset:3px }
.suite #output,.suite #result { background:var(--surface); color:var(--ink); border-radius:8px; box-shadow:none; overflow-wrap:anywhere }
.suite #output:empty,.suite #result:empty { display:none }
.suite .hero-panel,.suite .drop-zone,.suite .stats div { background:var(--surface); color:var(--ink); box-shadow:none }
.suite .hero-panel p,.suite .subtitle,.suite .hero-panel strong { color:var(--ink) }
.suite .hero-panel > span,.suite .hero .eyebrow { display:none }
.suite canvas { height:auto; max-width:100% }
.suite .container.suite-panel { max-width:none; width:auto; margin:0; transform:none }
.suite .container > label { display:flex; gap:8px; align-items:center; margin:10px 0; background:none; box-shadow:none }
.suite #length { width:100%; appearance:auto }
@media(max-width:650px) {
  .suite .tool-nav nav { padding:9px 14px; gap:3px 14px }
  .suite .suite-main,.suite .shell { padding:14px }
  .suite .suite-panel { padding:16px }
  .suite h1 { font-size:23px }
}
</style>
<body class="suite"><header class="tool-nav"><nav aria-label="工具导航"><a class="brand" href="https://baicaige.github.io/format-tool/">白菜的小工具</a><div><a href="https://baicaige.github.io/format-tool/#openid" aria-current="page">OpenID 拆分</a><a href="https://baicaige.github.io/excel-splitter/">Excel 拆分</a><a href="https://baicaige.github.io/format-tool/zhengjianzhao.html">证件照排版</a><a href="https://baicaige.github.io/format-tool/mima.html">随机密码</a></div></nav></header><main class="suite-main">
  <section class="suite-panel" id="openid">
    <h1>OpenID 拆分</h1>
    <form id="split">
      <label>Excel 或 CSV <input id="csv" type="file" accept=".xlsx,.xls,.csv" required></label>
      <label>提取列 <input id="sourceColumn" value="A" size="5" maxlength="3" pattern="[A-Za-z]{1,3}" required></label>
      <label><span><input id="skipHeader" type="checkbox" checked> 首行是表头</span></label>
      <label>每个 TXT 的条数
        <select id="size"><option>100</option><option>200</option><option selected>500</option><option>1000</option><option>2000</option><option>3000</option><option>5000</option><option>10000</option><option>15000</option><option>20000</option><option>30000</option><option>50000</option><option>100000</option></select>
      </label>
      <button id="splitBtn" type="submit">拆分 TXT</button>
    </form>
    <p id="status" role="status">文件在浏览器本地处理。</p>
    <button id="saveFolder" type="button" hidden>保存全部到文件夹</button>
    <ol id="downloads"></ol>
  </section>
  <section class="suite-panel" id="formatter">
    <h2>每行数据加逗号</h2>
    <textarea id="input" aria-label="原始文本" placeholder="请输入数据，每行一个"></textarea>
    <button id="formatBtn" type="button">格式化并复制</button>
    <pre id="output"></pre>
  </section>
</main>
<script src="../excel-splitter/vendor/xlsx.full.min.js"></script>
<script>
  // Quoted CSV fields can contain commas, line breaks and escaped quotes.
  function* csvRows(text) {
    const token = /(?:"((?:[^"]|"")*)"|([^",\r\n]*))(,|\r\n|\r|\n|$)/y;
    let row = [];
    while (token.lastIndex < text.length) {
      const match = token.exec(text);
      if (!match) throw new Error("CSV 格式有误，请重新导出。");
      row.push(match[1] === undefined ? match[2] : match[1].replace(/""/g, '"'));
      if (match[3] !== ",") {
        yield row;
        row = [];
      }
    }
    if (row.length) yield [...row, ""];
  }

  function extractColumn(rows, column, skipHeader) {
    const ids = [];
    for (const row of rows) {
      if (skipHeader) {
        skipHeader = false;
        continue;
      }
      const id = String(row[column] ?? "").trim();
      if (!id) continue;
      if (/[\r\n]/.test(id)) throw new Error("所选列包含换行，无法按每行一条导出。");
      ids.push(id);
    }
    if (!ids.length) throw new Error("所选列没有可导出的数据。");
    return ids;
  }

  async function readRows(file) {
    if (/\.csv$/i.test(file.name)) return csvRows((await file.text()).replace(/^\uFEFF/, ""));
    if (!window.XLSX) throw new Error("Excel 解析组件加载失败，请刷新后重试。");
    const book = XLSX.read(await file.arrayBuffer());
    const sheet = book.Sheets[book.SheetNames[0]];
    if (!sheet) throw new Error("Excel 文件没有可读取的工作表。");
    return XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, range: 0 });
  }

  const downloads = document.getElementById("downloads");
  const status = document.getElementById("status");
  const csv = document.getElementById("csv");
  const sourceColumn = document.getElementById("sourceColumn");
  const skipHeader = document.getElementById("skipHeader");
  const size = document.getElementById("size");
  const saveFolder = document.getElementById("saveFolder");
  let files = [];

  async function saveAll(folder) {
    const splitButton = document.getElementById("splitBtn");
    saveFolder.disabled = splitButton.disabled = csv.disabled = size.disabled = sourceColumn.disabled = skipHeader.disabled = true;
    let saved = 0;
    let skipped = 0;
    try {
      if (!folder && !window.showDirectoryPicker) {
        status.textContent = "当前浏览器不支持选择文件夹。请使用桌面版 Chrome 或 Edge，或逐个下载。";
        return;
      }
      folder ??= await window.showDirectoryPicker({ mode: "readwrite" });
      for (const file of files) {
        try {
          await folder.getFileHandle(file.name);
          skipped++;
          continue;
        } catch (error) {
          if (error.name === "TypeMismatchError") {
            skipped++;
            continue;
          }
          if (error.name !== "NotFoundError") throw error;
        }
        const handle = await folder.getFileHandle(file.name, { create: true });
        const writer = await handle.createWritable();
        try {
          await writer.write(file.blob);
          await writer.close();
        } catch (error) {
          await writer.abort().catch(() => {});
          throw error;
        }
        saved++;
      }
      status.textContent = `已保存 ${saved} 个 TXT，跳过同名项 ${skipped} 个。`;
    } catch (error) {
      status.textContent = error.name === "AbortError" && !saved && !skipped
        ? "已取消或未获得文件夹访问权限。"
        : `保存中断。已保存 ${saved} 个，跳过 ${skipped} 个。${error.message}`;
    } finally {
      saveFolder.disabled = splitButton.disabled = csv.disabled = size.disabled = sourceColumn.disabled = skipHeader.disabled = false;
    }
  }
  saveFolder.addEventListener("click", () => saveAll());

  function clearDownloads() {
    files.forEach(file => URL.revokeObjectURL(file.url));
    files = [];
    saveFolder.hidden = true;
    downloads.replaceChildren();
  }

  for (const control of [csv, size, sourceColumn, skipHeader]) {
    control.addEventListener("change", () => {
      clearDownloads();
      status.textContent = "等待拆分。";
    });
  }

  document.getElementById("split").addEventListener("submit", async event => {
    event.preventDefault();
    const button = document.getElementById("splitBtn");
    const file = csv.files[0];
    const batch = Number(size.value);
    const column = [...sourceColumn.value.toUpperCase()].reduce((n, letter) => n * 26 + letter.charCodeAt(0) - 64, 0) - 1;
    const hasHeader = skipHeader.checked;
    if (!file || !Number.isInteger(batch) || batch < 1) return;
    clearDownloads();
    button.disabled = csv.disabled = size.disabled = sourceColumn.disabled = skipHeader.disabled = true;
    status.textContent = "正在读取文件…";
    try {
      let folder;
      let folderMessage = "";
      if (window.showDirectoryPicker) {
        try {
          folder = await window.showDirectoryPicker({ mode: "readwrite" });
        } catch (error) {
          folderMessage = error.name === "AbortError"
            ? " 已取消选择文件夹，仍可下载下方文件。"
            : " 无法选择文件夹，仍可下载下方文件。";
        }
      }
      const ids = extractColumn(await readRows(file), column, hasHeader);
      const base = file.name.replace(/\.(?:csv|xlsx|xls)$/i, "");
      const list = document.createDocumentFragment();
      for (let start = 0; start < ids.length; start += batch) {
        const end = Math.min(start + batch, ids.length);
        const data = ids.slice(start, end).join("\n") + "\n";
        const link = document.createElement("a");
        const blob = new Blob([data], { type: "text/plain;charset=utf-8" });
        link.href = URL.createObjectURL(blob);
        link.download = link.textContent = `${base}-${start + 1}-${end}.txt`;
        files.push({ name: link.download, blob, url: link.href });
        const item = document.createElement("li");
        item.append(link);
        list.append(item);
      }
      downloads.append(list);
      saveFolder.hidden = false;
      status.textContent = `${ids.length} 条数据，共 ${files.length} 个 TXT。${folderMessage}`;
      if (folder) await saveAll(folder);
    } catch (error) {
      clearDownloads();
      status.textContent = error.message;
    } finally {
      button.disabled = csv.disabled = size.disabled = sourceColumn.disabled = skipHeader.disabled = false;
    }
  });

    async function formatAndCopy() {
      const input = document.getElementById("input").value.trim();
      if (!input) {
        alert("请输入内容");
        return;
      }

      const lines = input.split("\n").map((line) => line.trim()).filter((line) => line.length > 0);
      const formattedGroups = [];

      for (let i = 0; i < lines.length; i += 6) {
        const group = lines.slice(i, i + 6).map((line) => `'${line}'`);
        formattedGroups.push(group.join(", "));
      }

      const finalResult = formattedGroups.join(",\n");
      document.getElementById("output").textContent = finalResult;

      try {
        await navigator.clipboard.writeText(finalResult);
        alert("已复制到剪切板");
      } catch (err) {
        const temp = document.createElement("textarea");
        temp.value = finalResult;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand("copy");
        document.body.removeChild(temp);
        alert("已复制到剪切板（兼容模式）");
      }
    }

    document.getElementById("formatBtn").addEventListener("click", formatAndCopy);
  </script>
</body>
</body>
</html>
